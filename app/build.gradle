import org.gradle.api.GradleException

def signingKeyStorePath = System.getenv("SIGNING_KEY_STORE_PATH")
def signingKeyStorePassword = System.getenv("SIGNING_KEY_STORE_PASSWORD")
def signingKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
def signingKeyPassword = System.getenv("SIGNING_KEY_PASSWORD")
def releaseSigningEnabled = [
        signingKeyStorePath,
        signingKeyStorePassword,
        signingKeyAlias,
        signingKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.hashan0314.veritasdaily'
    compileSdk 35

    defaultConfig {
        applicationId "com.hashan0314.veritasdaily"
        minSdk 25
        targetSdk 35
        versionCode 10
        versionName "1.2.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (releaseSigningEnabled) {
                def signingStoreFile = file(signingKeyStorePath)
                def lowerCaseStoreName = signingStoreFile.name.toLowerCase()

                if (!signingStoreFile.exists()) {
                    throw new GradleException("SIGNING_KEY_STORE_PATH does not exist: ${signingStoreFile}")
                }

                if ([".der", ".cer", ".crt", ".pem"].any { lowerCaseStoreName.endsWith(it) }) {
                    throw new GradleException(
                            "SIGNING_KEY_STORE_PATH must point to a keystore file (.jks or .keystore), " +
                                    "but was set to '${signingStoreFile}'. " +
                                    "Certificates such as .der do not contain the private key required for release signing."
                    )
                }

                storeFile signingStoreFile
                storePassword signingKeyStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningEnabled) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
        //noinspection DataBindingWithoutKapt
        dataBinding true
    }
}

